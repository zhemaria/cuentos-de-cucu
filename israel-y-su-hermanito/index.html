<title>Israel y su hermanito</title>
<meta name="description" content="Un cuento ilustrado y narrado por Cucu para Israel, en español y en inglés.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* =========================================================
   LIBRO DE CUENTOS — plantilla reutilizable
   El contenido del cuento está en el objeto LIBRO (más abajo).
   ========================================================= */
:root{
  --papel:#fffaf0;
  --papel-borde:#ead9b9;
  --mesa:#2f4f6f;
  --mesa-2:#24405c;
  --tinta:#2b2b2b;
  --titulo:#0b6fa4;
  --acento:#e8792b;
  --boton:#ffffff;
  --sombra:0 18px 40px rgba(0,0,0,.35);
  --letra:1.7rem;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Andika",system-ui,sans-serif;
  color:var(--tinta);
  background:radial-gradient(ellipse at top,var(--mesa) 0%,var(--mesa-2) 100%);
  min-height:100dvh;
  display:flex;flex-direction:column;
}
.salto{position:absolute;left:-999px;top:0;background:#fff;padding:.5rem 1rem;z-index:50}
.salto:focus{left:1rem}

/* ---------- barra superior ---------- */
.barra{
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
  padding:.6rem 1rem;color:#fff;
}
.barra h1{
  font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.15rem;
  margin:0 auto 0 0;letter-spacing:.3px;
}
.barra a,.barra button{
  font:inherit;font-size:.95rem;color:#fff;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3);border-radius:999px;
  padding:.35rem .85rem;cursor:pointer;text-decoration:none;
  min-height:40px;display:inline-flex;align-items:center;gap:.35rem;
}
.barra a:hover,.barra button:hover{background:rgba(255,255,255,.26)}
.barra button[aria-pressed="true"]{background:var(--acento);border-color:var(--acento)}
:focus-visible{outline:3px solid #ffd54a;outline-offset:3px}

/* ---------- escenario del libro ---------- */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:.5rem 1rem 1rem;gap:.75rem}
.flecha{
  flex:none;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
  background:var(--boton);color:var(--titulo);font-size:1.8rem;line-height:1;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.flecha:disabled{opacity:.3;cursor:default}
.libro{
  position:relative;width:min(1400px,100%);
  aspect-ratio:16/10;max-height:calc(100dvh - 150px);
  perspective:4200px;
}
.hoja{
  position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;
  background:var(--papel);border-radius:10px;box-shadow:var(--sombra);
  overflow:hidden;
}
/* lomo del libro */
.hoja::after{
  content:"";position:absolute;top:0;bottom:0;left:50%;width:46px;transform:translateX(-50%);
  background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.13) 45%,rgba(0,0,0,.2) 50%,rgba(0,0,0,.13) 55%,rgba(0,0,0,0) 100%);
  pointer-events:none;
}
.hoja.sola{grid-template-columns:1fr}
.hoja.sola::after{display:none}
.lado{position:relative;overflow:auto;padding:2.2rem 2.4rem;display:flex;flex-direction:column;justify-content:center}
.lado.lamina{padding:0;background:#f3ead8;cursor:zoom-in}
.lado.lamina img{width:100%;height:100%;object-fit:contain;display:block}

/* portada a doble página: título a la izquierda, lámina completa a la derecha */
.lado.portada-izq{align-items:center;text-align:center;gap:1.1rem;
  background:radial-gradient(ellipse at center,#fffdf7 0%,var(--papel) 60%,#f6ead2 100%)}
.portada-izq .gran{font-family:"Fredoka",sans-serif;color:var(--titulo);font-size:clamp(2.2rem,4.2vw,3.6rem);line-height:1.08;margin:0}
.portada-izq .sub{margin:0;font-size:1.3rem;color:var(--acento);font-weight:700}
.portada-izq .cucu{width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.abrir{font:inherit;font-weight:700;font-size:1.2rem;color:#fff;background:var(--acento);border:none;
  border-radius:999px;padding:.7rem 1.6rem;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25)}
/* paso suave para páginas de ancho completo */
.hoja.suave{animation:suave .4s ease-out}
@keyframes suave{from{opacity:.25}to{opacity:1}}

/* hoja que gira sobre el lomo (solo en páginas dobles) */
.voltea{position:absolute;top:0;bottom:0;width:50%;z-index:6;transform-style:preserve-3d;pointer-events:none}
.voltea.der{left:50%;transform-origin:left center;animation:giraSig .75s ease-in-out forwards}
.voltea.izq{left:0;transform-origin:right center;animation:giraAnt .75s ease-in-out forwards}
@keyframes giraSig{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes giraAnt{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--papel);overflow:hidden;display:flex}
.cara > .lado{flex:1;min-width:0}
.cara.atras{transform:rotateY(180deg)}
.voltea.der .cara.frente,.voltea.izq .cara.atras{border-radius:0 10px 10px 0}
.voltea.der .cara.atras,.voltea.izq .cara.frente{border-radius:10px 0 0 10px}
/* sombra que recorre la hoja mientras gira */
.cara::after{content:"";position:absolute;inset:0;pointer-events:none;animation:sombraHoja .75s ease-in-out forwards}
@keyframes sombraHoja{0%{background:rgba(0,0,0,0)}50%{background:rgba(0,0,0,.18)}100%{background:rgba(0,0,0,0)}}
.queda{position:absolute;top:0;bottom:0;width:50%;z-index:5;display:flex;background:var(--papel);overflow:hidden}
.queda > .lado{flex:1;min-width:0}
.queda.izq{left:0;border-radius:10px 0 0 10px}
.queda.der{left:50%;border-radius:0 10px 10px 0}

/* ---------- textos ---------- */
.cuento p{font-size:var(--letra);line-height:1.7;margin:0 0 1rem}
.titulo-cap{
  font-family:"Fredoka",sans-serif;color:var(--titulo);text-align:center;
  font-size:clamp(1.8rem,3.4vw,2.8rem);line-height:1.2;margin:0 0 1rem;
}
.num-cap{display:block;text-align:center;color:var(--acento);font-family:"Fredoka",sans-serif;
  font-size:1.05rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:.4rem}
.portadilla{text-align:center}
.portadilla .gran{font-family:"Fredoka",sans-serif;color:var(--titulo);font-size:clamp(2rem,4vw,3.2rem);margin:.2rem 0 1rem}
.portadilla .autor{font-size:1.3rem}
.licencia{font-size:.8rem;color:#6b6b6b;margin-top:2rem}
.lado.indice{padding:1.6rem 2rem}
.indice h2{font-family:"Fredoka",sans-serif;color:var(--titulo);font-size:1.7rem;text-align:center;margin:0 0 .8rem}
.indice ol{list-style:none;margin:0;padding:0;counter-reset:cap}
.indice li{margin:.3rem 0}
.indice li:not(.ex){counter-increment:cap}
.indice a{
  display:flex;gap:.7rem;align-items:center;padding:.45rem .75rem;border-radius:10px;
  color:var(--tinta);text-decoration:none;font-size:1.05rem;background:#fff;border:1px solid var(--papel-borde);
}
.indice a:hover{background:#fff2df}
.indice a::before{
  content:counter(cap);flex:none;width:2rem;height:2rem;border-radius:50%;
  display:grid;place-items:center;background:var(--titulo);color:#fff;font-weight:700;
}
.indice a.extra::before{content:"♥";background:var(--acento)}
.lado.carta{justify-content:safe center;padding:1.6rem 2.2rem}
.carta .escuchar{margin-top:.2rem}
.lado.cuento{justify-content:safe center}
.carta h2{font-family:"Fredoka",sans-serif;color:var(--titulo);margin:0 0 .6em;font-size:1.55em}
.carta p{font-size:1em;line-height:1.55;margin:0 0 .6em}
.lado.carta{font-size:1.05rem}
.firma{font-family:"Fredoka",sans-serif;color:var(--titulo);font-size:1.25em;text-align:right}
.fin{font-family:"Fredoka",sans-serif;color:var(--titulo);font-size:clamp(4rem,10vw,7rem);text-align:center;margin:0}
.colorin{font-family:"Fredoka",sans-serif;color:var(--titulo);font-size:clamp(1.9rem,4.5vw,3rem);line-height:1.3;text-align:center;margin:0 0 1.2rem}
.lado.video-hoja{padding:0;background:#111;display:flex;align-items:center;justify-content:center}
.video-hoja video{width:100%;height:100%;object-fit:contain;background:#000}

/* botón de narración */
.escuchar{
  align-self:center;margin-top:.6rem;display:inline-flex;align-items:center;gap:.6rem;
  font:inherit;font-size:1.05rem;font-weight:700;color:var(--titulo);
  background:#fff;border:2px solid var(--titulo);border-radius:999px;padding:.3rem 1.1rem .3rem .3rem;cursor:pointer;
}
.escuchar img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#e8f3fa}
.escuchar .bocina{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:#e8f3fa}
.escuchar[aria-pressed="true"]{background:var(--titulo);color:#fff}
.escuchar:hover{box-shadow:0 0 0 4px rgba(11,111,164,.18)}

/* pie */
.pie{display:flex;align-items:center;justify-content:center;gap:1rem;color:#fff;padding:0 1rem .9rem;font-size:.95rem}
.pie #contador{white-space:nowrap}
.pie progress{width:min(320px,50vw);height:10px;accent-color:var(--acento)}

/* visor de lámina grande */
.visor{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:40;cursor:zoom-out}
.visor.abierto{display:flex}
.visor img{max-width:96vw;max-height:94dvh;border-radius:8px}
.visor button{position:absolute;top:1rem;right:1rem;width:48px;height:48px;border-radius:50%;border:none;font-size:1.6rem;cursor:pointer}

.pie .tocar{display:none;gap:.5rem}
/* ---------- celular y tableta vertical: una página a la vez ---------- */
@media (max-width:820px), (orientation:portrait){
  main{padding:.25rem .5rem .5rem;gap:0}
  .flecha{display:none}
  .libro{aspect-ratio:auto;height:calc(100dvh - 140px);max-height:none}
  .hoja{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  .hoja::after{display:none}
  .lado{padding:1.3rem 1.2rem;justify-content:flex-start}
  .lado.lamina{aspect-ratio:4/3}
  .hoja.portada{grid-template-rows:auto minmax(0,1fr);overflow:hidden}
  .portada-izq{padding:1rem 1rem .8rem;gap:.5rem}
  .portada-izq .cucu{display:none}
  .portada-izq .gran{font-size:2rem}
  .hoja.portada .lado.lamina{aspect-ratio:auto;height:100%}
  .indice + .lamina{display:none}
  .hoja.sola{grid-template-rows:1fr}
  .hoja.sola .lado{justify-content:center}
  .hoja.sola .lado.lamina{aspect-ratio:auto;height:100%}
  .barra{padding:.5rem .75rem;flex-wrap:nowrap;gap:.35rem}
  .barra h1{font-size:1rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barra a,.barra button{padding:.3rem .6rem;flex:none}
  .barra .txt{display:none}
  .libro{height:calc(100dvh - 125px)}
  .pie .tocar{display:inline-flex}
}
.pie .tocar button{width:48px;height:48px;border-radius:50%;border:none;background:#fff;color:var(--titulo);font-size:1.5rem;cursor:pointer}
.pie .tocar button:disabled{opacity:.3}

body.letra-grande{--letra:2.1rem}
#btn-idioma{font-weight:700}
.indice h2{margin-bottom:.4rem}
.indice li{margin:.18rem 0}
.indice a{padding:.2rem .6rem;font-size:1rem}
.indice a::before{width:1.7rem;height:1.7rem}
.lado.cuento p{line-height:1.6}
@media (max-width:820px), (orientation:portrait){
  .hoja:not(.portada):not(.sola) .lado.lamina{aspect-ratio:auto;height:58dvh}
  :root{--letra:1.45rem}
  body.letra-grande{--letra:1.8rem}
}

/* portada: una sola lámina horizontal, con el título debajo */
.hoja.portada{display:flex;flex-direction:column;overflow:hidden}
.hoja.portada::after{display:none}
.hoja.portada .lado.lamina{flex:1 1 0;min-height:0;height:auto;aspect-ratio:auto;padding:0}
.hoja.portada .portada-izq{flex:none;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:.4rem 1.2rem;padding:.7rem 1rem}
.hoja.portada .cucu{display:none}
.hoja.portada .gran{font-size:clamp(1.5rem,2.6vw,2.3rem)}
.hoja.portada .sub{font-size:1.05rem}
.hoja.portada .abrir{padding:.5rem 1.3rem;font-size:1.1rem}

@media (max-width:820px), (orientation:portrait){
  .hoja.portada{justify-content:center;background:var(--papel)}
  .hoja.portada .lado.lamina{flex:none;width:100%;aspect-ratio:1376/768}
}
</style>

   "texto": "—¿Qué es un hermanito? —preguntó Israel, frunciendo el ceño. Su mamá se agachó junto a él y respondió: —Un hermanito es como un nuevo mejor amigo que vivirá con nosotros. Podrá jugar contigo y compartir tus juguetes. Israel se imaginó tener a alguien con quien jugar y sintió una pequeña chispa de emoción, aunque también un poco de miedo porque no sabía cómo sería.",
   "texto_en": "\"What's a little brother?\" Israel asked, frowning. His mom crouched down next to him and answered, \"A little brother is like a new best friend who will live with us. He'll be able to play with you and share your toys.\" Israel imagined having someone to play with and felt a tiny spark of excitement, but he was also a little scared, because he didn't know what it would be like."
  },
  {
   "tipo": "pagina",
   "pista": "3",
   "img": "images/3.jpg",
   "alt": "La familia cena de noche; Mamá está embarazada",
   "alt_en": "The family has dinner at night; Mom is pregnant",
   "texto": "Esa noche, mientras cenaban, su papá le dijo: —Tu hermanito necesitará mucho cuidado, igual que cuando eras un bebé. Israel pensó en cómo sus papás siempre cuidaban de él, y se dio cuenta de que eso no cambiaría; simplemente habría un segundo niño al que también atender. —¿Me dejarán jugar a la pelota con él? —preguntó Israel, y sus padres rieron, prometiéndole que un día sí.",
   "texto_en": "That night, during dinner, his dad told him, \"Your little brother will need a lot of care, just like you did when you were a baby.\" Israel thought about how his parents always took care of him, and he realized that wouldn't change: there would just be a second child to look after too. \"Will you let me play ball with him?\" Israel asked, and his parents laughed and promised that one day he could."
  },
  {
   "tipo": "pagina",
   "pista": "4",
   "img": "images/4.jpg",
   "alt": "Israel apoya la cabeza en la barriga de Mamá, junto a un castillo de almohadas",
   "alt_en": "Israel rests his head on Mom's belly, next to a pillow fort",
   "texto": "Pasaron las semanas y, aunque Israel a veces se sentía un poco celoso, su mamá siempre le hablaba de lo genial que sería tener un hermano pequeño. —Juntos podrán hacer mil aventuras —le decía. Y aunque no lo podía ver aún, Israel empezó a imaginar todas las cosas divertidas que haría con su hermanito, desde construir castillos de almohadas hasta jugar al escondite.",
   "texto_en": "Weeks went by, and even though Israel sometimes felt a little jealous, his mom always told him how great it would be to have a little brother. \"Together you'll have a thousand adventures,\" she would say. And even though he couldn't see him yet, Israel began to imagine all the fun things he would do with his little brother, from building pillow forts to playing hide-and-seek."
  },
  {
   "tipo": "pagina",
   "pista": "5",
   "img": "images/5.jpg",
   "alt": "En el hospital, Israel saluda a su hermanito recién nacido",
   "alt_en": "At the hospital, Israel says hello to his newborn brother",
   "texto": "Finalmente, llegó el gran día. Israel conoció a su hermano, que era un pequeño bebé con unas manitas regordetas. Se sintió feliz y lleno de amor por aquel pequeño ser. —¡Hola, hermanito! —le dijo Israel con una gran sonrisa. De repente, entendió que tener un hermano era como tener un nuevo compañero de aventuras. Y, desde ese momento, su corazón se llenó de alegría al pensar en todas las travesuras que harían juntos.",
   "texto_en": "At last, the big day arrived. Israel met his brother, a tiny baby with chubby little hands. He felt happy and full of love for that little one. \"Hi, little brother!\" Israel said with a big smile. Suddenly, he understood that having a brother was like having a new adventure buddy. And from that moment on, his heart filled with joy as he thought about all the fun mischief they would get up to together."
  },
  {
   "tipo": "capitulo",
   "id": "cap-2",
   "titulo": "Israel y su nuevo hermanito",
   "titulo_en": "Israel and His New Baby Brother",
   "pista": "cap2",
   "img": "images/cap2.jpg",
   "alt": "Israel mira a su hermanito recién nacido, que duerme en la cuna",
   "alt_en": "Israel looks at his newborn baby brother sleeping in the crib"
  },
  {
   "tipo": "pagina",
   "pista": "6",
   "img": "images/6.jpg",
   "alt": "Papá y Mamá miman al bebé mientras Israel los mira un poco triste",
   "alt_en": "Mom and Dad cuddle the baby while Israel watches, a little sad",
   "texto": "Israel se sintió muy feliz con su nuevo hermanito llamado Adrián. ¡Era tan pequeñito! Pero Israel empezó a notar que sus papás pasaban mucho tiempo con Adrián, llevándolo en brazos, jugando con él y dándole muchos abrazos. Israel no entendía por qué todos se fijaban tanto en su nuevo hermanito y empezó a sentir un poco de celos.",
   "texto_en": "Israel was very happy with his new baby brother, whose name was Adrián. He was so tiny! But Israel started to notice that his parents spent a lot of time with Adrián, carrying him, playing with him and giving him lots of hugs. Israel didn't understand why everyone paid so much attention to his new little brother, and he started to feel a little jealous."
  },
  {
   "tipo": "pagina",
   "pista": "7",
   "img": "images/7.jpg",
   "alt": "Israel, con los brazos cruzados, mientras Mamá carga a Adrián",
   "alt_en": "Israel, with his arms crossed, while Mom holds Adrián",
   "texto": "Un día, mientras su mamá estaba cargando a Adrián, Israel se acercó y, haciendo pucheros, le dijo: —¡Yo también quiero que me carguen! Su mamá le sonrió y le explicó: —Adrián es muy chiquitito, necesita más ayuda. ¡Pero tú eres un niño grande y fuerte! A Israel le gustó lo que escuchó, pero aún no podía evitar pensar que era menos especial que su hermanito.",
   "texto_en": "One day, while his mom was holding Adrián, Israel came closer and, pouting, said, \"I want to be held too!\" His mom smiled and explained, \"Adrián is very little; he needs more help. But you are a big, strong boy!\" Israel liked what he heard, but he still couldn't help thinking that he was less special than his little brother."
  },
  {
   "tipo": "pagina",
   "pista": "8",
   "img": "images/8.jpg",
   "alt": "Papá, arrodillado, habla con cariño con Israel",
   "alt_en": "Dad kneels and talks lovingly with Israel",
   "texto": "Sus papás vieron que Israel estaba un poco triste y decidieron hablar con él. Su papá se agachó a su altura y le dijo: —Israel, tú sigues siendo nuestro niño especial. A veces, los bebés necesitan un poco más de atención. Pero siempre habrá un lugar grande y cálido para ti en nuestros brazos. Israel empezó a sentir que no tenía que preocuparse: sus papás lo querían tanto como a Adrián.",
   "texto_en": "His parents saw that Israel was a little sad, and they decided to talk with him. His dad crouched down to his level and said, \"Israel, you are still our special boy. Sometimes babies need a little more attention. But there will always be a big, warm place for you in our arms.\" Israel began to feel that he didn't need to worry: his parents loved him just as much as Adrián."
  },
  {
   "tipo": "pagina",
   "pista": "9",
   "img": "images/9.jpg",
   "alt": "Israel le regala su osito a Adrián y sus papás aplauden",
   "alt_en": "Israel gives his teddy bear to Adrián and his parents clap",
   "texto": "Días después, Israel tuvo una idea brillante. Fue corriendo a buscar su peluche favorito y se lo dio a Adrián. —Este es mi amigo, puedes jugar con él, ¡pero a mí también me necesitas! —dijo con una sonrisa. Sus papás aplaudieron y le dijeron que era muy generoso. Desde entonces, Israel comenzó a jugar con Adrián y se dio cuenta de que ser hermano mayor era una aventura muy divertida.",
   "texto_en": "A few days later, Israel had a brilliant idea. He ran to get his favorite stuffed animal and gave it to Adrián. \"This is my friend. You can play with him, but you need me too!\" he said with a smile. His parents clapped and told him he was very generous. From then on, Israel began to play with Adrián, and he discovered that being a big brother was a really fun adventure."
  },
  {
   "tipo": "pagina",
   "pista": "10",
   "img": "images/10.jpg",
   "alt": "La familia se abraza en el sofá",
   "alt_en": "The family hugs on the sofa",
   "texto": "Con el tiempo, Israel aprendió que tener un hermanito no significaba tener menos amor, sino que el amor se multiplicaba. Ahora, siempre que sus papás cargaban a Adrián, Israel se unía a ellos con gusto, porque sabía que ellos también estaban allí para él. Y así, con risas y juegos, Israel y Adrián se convirtieron en los mejores amigos, mostrando al mundo que el amor de una familia nunca se divide: ¡se multiplica!",
   "texto_en": "With time, Israel learned that having a little brother didn't mean having less love: love multiplied. Now, whenever his parents held Adrián, Israel happily joined them, because he knew they were there for him too. And so, with laughter and games, Israel and Adrián became best friends, showing the world that a family's love never divides: it multiplies!"
  },
  {
   "tipo": "capitulo",
   "id": "cap-3",
   "titulo": "Las aventuras de Israel y Adrián",
   "titulo_en": "The Adventures of Israel and Adrián",
   "pista": "cap3",
   "img": "images/cap3.jpg",
   "alt": "Israel y Adrián bebé juegan con una pelota de colores en el jardín",
   "alt_en": "Israel and baby Adrián play with a colorful ball in the backyard"
  },
  {
   "tipo": "pagina",
   "pista": "11",
   "img": "images/11.jpg",
   "alt": "En el jardín, Israel llama a Adrián, que gatea hacia él",
   "alt_en": "In the backyard, Israel calls Adrián, who crawls toward him",
   "texto": "En un soleado día de primavera, Israel decidió que era el momento perfecto para jugar con su hermanito Adrián. Con un año de edad, Adrián ya era un niño fuerte y curioso. Sus ojos brillaban de emoción cada vez que veía a su hermano mayor acercarse. Israel sonrió y pensó en las muchas aventuras que podrían tener juntos, así que se sentó en el suave césped del jardín y lo llamó: —¡Adrián, ven aquí! ¡Vamos a jugar!",
   "texto_en": "On a sunny spring day, Israel decided it was the perfect time to play with his little brother Adrián. At one year old, Adrián was already a strong and curious little boy. His eyes sparkled with excitement every time he saw his big brother coming. Israel smiled and thought about all the adventures they could have together, so he sat down on the soft grass in the backyard and called him: \"Adrián, come here! Let's play!\""
  },
  {
   "tipo": "pagina",
   "pista": "12",
   "img": "images/12.jpg",
   "alt": "Israel le enseña la pelota a Adrián mientras sus papás se acercan",
   "alt_en": "Israel shows Adrián the ball while their parents come over",
   "texto": "Israel comenzó a enseñarle palabras divertidas. —Di «pelota» —le dijo mientras sostenía una colorida pelota que rebotaba con un sonido mágico. Adrián miró la pelota con atención y, con un poco de esfuerzo, dijo: —Pe-po-ta. Ambos se rieron a carcajadas, y esto hizo que sus papás se acercaran a ver qué sucedía. Les encantaba ver cómo sus dos pequeños se divertían juntos.",
   "texto_en": "Israel began teaching him fun words. \"Say 'pelota,'\" he told him (that means \"ball\" in Spanish), holding up a colorful ball that bounced with a magical sound. Adrián looked at the ball carefully and, with a little effort, said, \"Pe-po-ta.\" They both burst out laughing, and that made their parents come over to see what was going on. They loved watching their two little boys having fun together."
  },
  {
   "tipo": "pagina",
   "pista": "13",
   "img": "images/13.jpg",
   "alt": "Israel hace una torre de bloques y Adrián aplaude",
   "alt_en": "Israel builds a tower of blocks and Adrián claps",
   "texto": "Más tarde, Israel quiso enseñarle a Adrián cómo jugar con los bloques de construcción. Le mostró cómo apilar los bloques uno sobre otro. —Así, mira, hermano —dijo mientras hacía una torre alta. Adrián aplaudió emocionado y, aunque a veces los bloques se caían, él no se desanimaba. Israel lo animó: —¡Buen intento, Adrián! Pronto lo harás muy bien.",
   "texto_en": "Later, Israel wanted to teach Adrián how to play with building blocks. He showed him how to stack the blocks one on top of another. \"Like this, look, brother,\" he said as he built a tall tower. Adrián clapped excitedly, and even though the blocks sometimes fell down, he didn't give up. Israel cheered him on: \"Good try, Adrián! Soon you'll do it really well.\""
  },
  {
   "tipo": "pagina",
   "pista": "14",
   "img": "images/14.jpg",
   "alt": "La familia, dentro de una tienda en el jardín al atardecer",
   "alt_en": "The family inside a tent in the backyard at sunset",
   "texto": "Al atardecer, sus papás se unieron a ellos e hicieron una casa de campaña como los tipis de los indios sioux. —¡Es nuestra casa de aventuras! —exclamó Israel. Adrián sonrió, sintiéndose parte de algo grandioso. Los tres se acomodaron dentro de la casa de campaña. Papá y mamá comenzaron a contar historias de piratas y tesoros escondidos.",
   "texto_en": "At sunset, their parents joined them and made a tent like the tipis of the Sioux people. \"It's our adventure house!\" Israel exclaimed. Adrián smiled, feeling part of something wonderful. They all snuggled up inside the tent. Mom and Dad began telling stories about pirates and hidden treasure."
  },
  {
   "tipo": "pagina",
   "pista": "15",
   "img": "images/15.jpg",
   "alt": "Los papás abrazan a Israel y a Adrián al anochecer",
   "alt_en": "Mom and Dad hug Israel and Adrián at dusk",
   "texto": "Cuando el sol comenzó a ocultarse, Israel y Adrián estaban muy cansados, pero felices. Habían aprendido y jugado juntos todo el día. Sus papás abrazaron a los dos, sintiendo ese amor tan especial entre hermanos. Israel miró a Adrián y le susurró: —Nunca olvides que siempre seré tu compañero de aventuras. Adrián aplaudió y, aunque no lo dijera, en su corazón sabía que eso era cierto. ¡Y así concluyó su divertido día lleno de risas y aprendizaje!",
   "texto_en": "When the sun began to set, Israel and Adrián were very tired, but happy. They had learned and played together all day long. Their parents hugged them both, feeling that very special love between brothers. Israel looked at Adrián and whispered, \"Never forget that I'll always be your adventure buddy.\" Adrián clapped, and even though he couldn't say it, in his heart he knew it was true. And that's how their fun day full of laughter and learning came to an end!"
  },
  {
   "tipo": "capitulo",
   "id": "cap-4",
   "titulo": "La primera aventura escolar de Israel",
   "titulo_en": "Israel's First School Adventure",
   "pista": "cap4",
   "img": "images/cap4.jpg",
   "alt": "Israel saluda frente a su casa, con su mochila nueva, el primer día de escuela",
   "alt_en": "Israel waves in front of his house with his new backpack on his first day of school"
  },
  {
   "tipo": "pagina",
   "pista": "16",
   "img": "images/16.jpg",
   "alt": "Miss Quintero da la bienvenida a Israel en el salón de kínder",
   "alt_en": "Miss Quintero welcomes Israel to the kindergarten classroom",
   "texto": "Hoy era un día muy especial para Israel, porque ¡iba a su primer día de escuela! Con una mochila nueva y muchas ganas, se despidió de su mamá y se unió a otros niños que también iban al Kindergarten. Todo era emocionante y nuevo. Al entrar al aula, vio una gran pizarra llena de colores y figuras. La maestra, una amable señora con ojos brillantes, les dio la bienvenida y les dijo que en ese lugar aprenderían muchas cosas divertidas.",
   "texto_en": "Today was a very special day for Israel, because it was his first day of school! With a new backpack and lots of excitement, he said goodbye to his mom and joined the other children who were also going to kindergarten. Everything was exciting and new. When he walked into the classroom, he saw a big board full of colors and shapes. The teacher, a kind lady with sparkling eyes, welcomed them and told them that in this place they would learn lots of fun things."
  },
  {
   "tipo": "pagina",
   "pista": "17",
   "img": "images/17.jpg",
   "alt": "Israel muestra su pintura de un cielo azul",
   "alt_en": "Israel shows his painting of a blue sky",
   "texto": "Durante la mañana, Israel y sus amigos aprendieron los colores. Aprendieron que el mar es azul, el sol es amarillo y las fresas son rojas. Cada niño tuvo que decir su color favorito. Israel sonrió al decir que su color preferido era el azul, como el del cielo. Después de pintar con muchos colores, la maestra les presentó las formas: círculos, cuadrados y triángulos. ¡Qué divertido era aprender jugando!",
   "texto_en": "During the morning, Israel and his friends learned the colors. They learned that the sea is blue, the sun is yellow and strawberries are red. Each child had to say their favorite color. Israel smiled as he said that his favorite color was blue, like the sky. After painting with lots of colors, the teacher showed them the shapes: circles, squares and triangles. Learning through play was so much fun!"
  },
  {
   "tipo": "pagina",
   "pista": "18",
   "img": "images/18.jpg",
   "alt": "Israel cuenta con los dedos hasta diez",
   "alt_en": "Israel counts to ten on his fingers",
   "texto": "Más tarde, llegó la hora de los números. Israel contaba con sus deditos y se emocionaba al llegar al diez. La maestra les enseñó a sumar con juguetes, y eso les hizo reír mucho. Al finalizar la clase, todos aprendieron a escribir las letras del abecedario. Israel se sentía cada vez más feliz, sintiendo que cada cosa que aprendía era una nueva aventura.",
   "texto_en": "Later, it was time for numbers. Israel counted on his little fingers and got excited when he reached ten. The teacher taught them to add with toys, and that made them laugh a lot. At the end of class, they all learned to write the letters of the alphabet. Israel felt happier and happier, as if everything he learned were a new adventure."
  },
  {
   "tipo": "pagina",
   "pista": "19",
   "img": "images/19.jpg",
   "alt": "Israel le enseña los colores a Adrián con una manzana y una naranja",
   "alt_en": "Israel teaches Adrián the colors with an apple and an orange",
   "texto": "Cuando llegó a casa, Israel no podía esperar para compartir lo que había aprendido. —¡Adrián, ven rápido! —gritó a su hermanito. Juntos se sentaron en la alfombra, e Israel comenzó a enseñarle los colores. —Mira, esta manzana es roja y esta naranja es amarilla. Adrián sonreía. Israel continuaba: —Ese dado que tienes en la mano es azul.",
   "texto_en": "When he got home, Israel couldn't wait to share what he had learned. \"Adrián, come quick!\" he called to his little brother. They sat down together on the rug, and Israel began teaching him the colors. \"Look, this apple is red and this orange is yellow.\" Adrián smiled. Israel went on: \"That cube in your hand is blue.\""
  },
  {
   "tipo": "pagina",
   "pista": "20",
   "img": "images/20.jpg",
   "alt": "Israel acompaña a Adrián, que duerme abrazado al osito",
   "alt_en": "Israel lies next to Adrián, who sleeps hugging the teddy bear",
   "texto": "Cuando anocheció, Israel y Adrián se fueron a la cama. Como Adrián aún era muy pequeñito, Israel se acostó a su lado para que no tuviera miedo, mientras Adrián abrazaba el osito de peluche que le regaló Israel cuando era pequeñito.",
   "texto_en": "When night came, Israel and Adrián went to bed. Since Adrián was still very little, Israel lay down next to him so he wouldn't be scared, while Adrián hugged the teddy bear Israel had given him when he was a baby."
  },
  {
   "tipo": "capitulo",
   "id": "cap-5",
   "titulo": "La aventura de Israel y Génesis",
   "titulo_en": "Israel and Génesis's Adventure",
   "pista": "cap5",
   "img": "images/cap5.jpg",
   "alt": "Israel lleva de la mano a Génesis y a Adrián en un parque junto al lago",
   "alt_en": "Israel holds hands with Génesis and Adrián in a park by the lake"
  },
  {
   "tipo": "pagina",
   "pista": "21",
   "img": "images/21.jpg",
   "alt": "Israel y Adrián esperan a Génesis junto a la ventana",
   "alt_en": "Israel and Adrián wait for Génesis by the window",
   "texto": "Israel estaba muy emocionado porque su prima Génesis venía de México. Era la primera vez que la iba a conocer. Desde que su mamá le contó que iba a visitarles, no podía dejar de pensar en lo divertido que sería jugar juntos. Israel sabía que Génesis era de la misma edad que su hermanito Adrián, y eso lo llenaba de alegría. ¡Tres niños juntos siempre es mejor que uno!",
   "texto_en": "Israel was very excited because his cousin Génesis was coming from Mexico. It was the first time he would meet her. Ever since his mom told him she was coming to visit, he couldn't stop thinking about how much fun it would be to play together. Israel knew that Génesis was the same age as his little brother Adrián, and that made him very happy. Three kids together are always better than one!"
  },
  {
   "tipo": "pagina",
   "pista": "22",
   "img": "images/22.jpg",
   "alt": "Génesis llega y abraza a Israel frente al garaje",
   "alt_en": "Génesis arrives and hugs Israel in front of the garage",
   "texto": "Cuando Génesis llegó, llevaba una sonrisa tan grande que iluminó toda la casa. Israel la miró y pensó que era igualita a la foto que había visto antes. Tenía el cabello rizado y unos ojos brillantes que reflejaban la aventura. —¡Hola, prima! —le dijo Israel, corriendo hacia ella. Génesis le respondió con un abrazo cálido y, en ese momento, Israel supo que se harían grandes amigos.",
   "texto_en": "When Génesis arrived, she had a smile so big it lit up the whole house. Israel looked at her and thought she looked just like the photo he had seen before. She had curly hair and bright eyes full of adventure. \"Hi, cousin!\" Israel said, running toward her. Génesis answered with a warm hug, and right then, Israel knew they would become great friends."
  },
  {
   "tipo": "pagina",
   "pista": "23",
   "img": "images/23.jpg",
   "alt": "Los tres niños hacen una carrera de sacos en Navy Pier",
   "alt_en": "The three children have a sack race at Navy Pier",
   "texto": "A la mañana siguiente, que era sábado, los tres niños salieron con sus mamás a visitar el Navy Pier de Chicago. Allí disfrutaron corriendo entre los chorros de agua que salían del piso, montaron en la rueda y también en un gran tobogán y una cama elástica. Mientras corrían y reían, Génesis les mostró a Israel y a Adrián un juego que había traído de México: «La carrera de sacos». Aunque al principio se caían y reían, pronto se convirtieron en unos expertos en saltar.",
   "texto_en": "The next morning, which was Saturday, the three children went with their moms to visit Navy Pier in Chicago. There they had fun running through the water jets that sprang up from the ground, and they rode the Ferris wheel and also a big slide and a trampoline. While they ran and laughed, Génesis showed Israel and Adrián a game she had brought from Mexico: the sack race. Even though they kept falling down and laughing at first, they soon became expert jumpers."
  },
  {
   "tipo": "pagina",
   "pista": "24",
   "img": "images/24.jpg",
   "alt": "Génesis cuenta historias de México: una piñata, un alebrije y un pueblo",
   "alt_en": "Génesis tells stories about Mexico: a piñata, an alebrije and a town",
   "texto": "A medida que pasaba el día, empezaron a hablar sobre México y sus pueblos mágicos. Génesis les contó sobre las piñatas y la deliciosa comida que había en su país. Israel y Adrián estaban tan asombrados que no dejaban de hacer preguntas, sobre todo cuando Génesis les contó sobre los alebrijes, que son como los ángeles guardianes, pero mexicanos. Cada historia hacía que el corazón de Israel y Adrián se llenara de ganas de conocer México.",
   "texto_en": "As the day went on, they began talking about Mexico and its magical towns. Génesis told them about piñatas and the delicious food of her country. Israel and Adrián were so amazed that they kept asking questions, especially when Génesis told them about alebrijes, which are like guardian angels, but Mexican. Every story filled Israel's and Adrián's hearts with the wish to visit Mexico."
  },
  {
   "tipo": "pagina",
   "pista": "25",
   "img": "images/25.jpg",
   "alt": "Israel, Génesis y Adrián, sentados en la hierba bajo las estrellas",
   "alt_en": "Israel, Génesis and Adrián sit on the grass under the stars",
   "texto": "Al caer la tarde, Israel, Génesis y Adrián se sentaron en la hierba, cansados pero felices. Miraban hacia el cielo, que se llenaba de estrellas. Israel se dio cuenta de que sentía un cariño muy especial por su prima. —Espero que podamos jugar juntos muchas veces más —dijo. Génesis sonrió y le respondió: —¡Así será! ¡Esto es solo el comienzo de nuestras aventuras! Y así, los tres amigos soñaron con la próxima gran fiesta que tendrían cuando los tres estuvieran en México.",

/* NARRACIÓN. En "es"/"en": false = sin audio; true = todas las páginas;
   o una lista de pistas ya grabadas (["cap1","1","2",...]) mientras se completa.
   Archivos: audio/es-1.mp3, audio/es-cap1.mp3, audio/en-1.mp3, audio/en-cap1.mp3, audio/es-fin.mp3, audio/en-fin.mp3
   Carta: "carta": {"es": true/false, "en": true/false} → audio/es-carta.mp3, audio/en-carta.mp3 */

/* =========================================================
   MOTOR DEL LIBRO (no hace falta tocarlo)
   ========================================================= */
(function(){
  const $ = s => document.querySelector(s);
  const libro = $("#libro"), voz = $("#voz");
  const hojas = LIBRO.hojas;
  let actual = 0;
  let leerSolo = false;
  let idioma = "es"; // cada visita empieza en español
  const EN = () => idioma === "en";
  const tx = (es, en) => EN() ? en : es;
  const campo = (h, c) => EN() ? h[c + "_en"] : h[c];
  function audioDe(h){
    const n = LIBRO.narracion;
    if(h.tipo === "carta") return (n.carta && n.carta[idioma]) ? `audio/${idioma}-carta.mp3` : "";
    const pistas = n[idioma];
    if(!h.pista || !pistas) return "";
    if(Array.isArray(pistas) && !pistas.includes(h.pista)) return "";
    return `audio/${idioma}-${h.pista}.mp3`;
  }

  // Preferencias del lector (si el navegador no las guarda, no pasa nada)
  try{
    leerSolo = localStorage.getItem("cucu-leer") === "1";
    if(localStorage.getItem("cucu-letra") === "1") document.body.classList.add("letra-grande");
  }catch(e){}
  $("#btn-auto").setAttribute("aria-pressed", leerSolo);
  $("#btn-letra").setAttribute("aria-pressed", document.body.classList.contains("letra-grande"));

  const capitulos = hojas.map((h,i)=>({h,i})).filter(o=>o.h.tipo==="capitulo");
  const esc = t => String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // conVozDeCucu: solo la carta, que está narrada con la voz de Zhema
  function botonEscuchar(audio, conVozDeCucu){
    if(!audio) return "";
    const etiqueta = conVozDeCucu ? tx("Escuchar a Cucu","Listen to Cucu") : tx("Escuchar el cuento","Listen to the story");
    const icono = conVozDeCucu ? `<img src="${esc(LIBRO.avatar)}" alt="">` : `<span class="bocina" aria-hidden="true">🔊</span>`;
    return `<button class="escuchar" type="button" data-audio="${esc(audio)}" data-etiqueta="${etiqueta}" aria-pressed="false">
      ${icono} <span class="rotulo">${etiqueta}</span></button>`;
  }
  function lamina(img, alt, contener){
    return `<div class="lado lamina${contener?" contener":""}" data-grande="${esc(img)}" role="button" tabindex="0" aria-label="${tx("Ver la lámina en grande","See the picture large")}: ${esc(alt||"")}">
      <img src="${esc(img)}" alt="${esc(alt||"Ilustración del cuento")}"></div>`;
  }

  function pintar(h, i){
    switch(h.tipo){
      case "portada":
        return `<div class="hoja sola portada">
          ${lamina(h.img, campo(h,"alt"))}
          <div class="lado portada-izq">
            <img class="cucu" src="${esc(LIBRO.avatar)}" alt="">
            <h2 class="gran">${esc(campo(LIBRO,"titulo"))}</h2>
            <p class="sub">${tx("Un cuento de Cucu","A story by Cucu")}</p>
            <button class="abrir" type="button" data-ir="1">${tx("Abrir el libro ›","Open the book ›")}</button>
          </div></div>`;
      case "portadilla":
        return `<div class="hoja">
          <div class="lado portadilla">
            <p class="gran">${esc(campo(LIBRO,"titulo"))}</p>
            <p class="autor">${tx("Escrito con cariño por","Written with love by")}<br><strong>${esc(LIBRO.autor)}</strong></p>
          </div>
          <div class="lado portadilla">
            ${LIBRO.narracion[idioma] ? tx("<p>Toca <strong>Escuchar el cuento</strong> en cada página para oírlo en voz alta.</p>","<p>Tap <strong>Listen to the story</strong> on each page to hear it read aloud.</p>") : ""}
            <p>${tx("Pasa las páginas con las flechas, con el teclado o deslizando el dedo.","Turn the pages with the arrows, the keyboard or by swiping.")}</p>
            <p class="licencia">${tx("Esta obra está bajo una licencia Creative Commons 4.0 Internacional: Reconocimiento – No Comercial – Compartir Igual.","This work is licensed under Creative Commons 4.0 International: Attribution – NonCommercial – ShareAlike.")}</p>
          </div></div>`;
      case "indice": {
        const items = capitulos.map((c,n)=>`<li><a href="#${c.h.id}">${esc(campo(c.h,"titulo"))}</a></li>`).join("");
        const fin = hojas.findIndex(x=>x.id==="final");
        return `<div class="hoja"><nav class="lado indice" id="indice-nav" aria-label="${tx("Índice","Contents")}">
          <h2>${tx("Viajando por el libro","Inside the book")}</h2>
          <ol><li class="ex"><a class="extra" href="#carta">${esc(campo(hojas.find(x=>x.tipo==="carta"),"titulo"))}</a></li>${items}
          ${fin>=0?`<li class="ex"><a class="extra" href="#final">${tx("El final con video","The ending, with a video")}</a></li>`:""}</ol></nav>
          ${h.img ? lamina(h.img, campo(h,"alt")) : ""}</div>`;
      }
      case "carta":
        return `<div class="hoja">
          ${lamina(h.img, campo(h,"alt"), true)}
          <div class="lado carta"><h2>${esc(campo(h,"titulo"))}</h2>
          ${campo(h,"parrafos").map(p=>`<p>${esc(p)}</p>`).join("")}
          <p class="firma">${esc(campo(h,"firma"))}</p>${botonEscuchar(audioDe(h), true)}</div></div>`;
      case "video":
        return `<div class="hoja sola"><div class="lado video-hoja">
          <video controls preload="none" playsinline poster="${esc(h.poster)}" aria-label="${esc(campo(h,"etiqueta")||h.etiqueta)}">
            <source src="${esc(campo(h,"src")||h.src)}" type="video/mp4">${h.subtitulos?`<track kind="captions" src="${esc(campo(h,"subtitulos"))}" srclang="${idioma}" label="${tx("Español","English")}">`:""}${tx("Tu navegador no puede mostrar este video.","Your browser cannot show this video.")}</video></div></div>`;
      case "capitulo": {
        const n = capitulos.findIndex(c=>c.i===i)+1;
        return `<div class="hoja">${lamina(h.img, campo(h,"alt"))}
          <div class="lado cuento"><span class="num-cap">${tx("Capítulo","Chapter")} ${n}</span>
          <h2 class="titulo-cap">${esc(campo(h,"titulo"))}</h2>${botonEscuchar(audioDe(h))}</div></div>`;
      }
      case "pagina":
        return `<div class="hoja">${lamina(h.img, campo(h,"alt"))}
          <div class="lado cuento"><p>${esc(campo(h,"texto"))}</p>${botonEscuchar(audioDe(h))}</div></div>`;
      case "fin":
        return `<div class="hoja sola"><div class="lado" style="text-align:center">
          <p class="colorin">${tx("Colorín colorado,<br>este cuento se&nbsp;ha&nbsp;acabado.","And they all lived<br>happily ever after.")}</p>${botonEscuchar(audioDe(h))}
          <p><a href="#indice">${tx("Volver al índice","Back to contents")}</a> · <a href="../">${tx("Ver otros cuentos de Cucu","See more stories by Cucu")}</a></p></div></div>`;
    }
    return "";
  }

  function pararVoz(){
    voz.pause();
    document.querySelectorAll(".escuchar").forEach(b=>{b.setAttribute("aria-pressed","false");b.querySelector(".rotulo").textContent=b.dataset.etiqueta;});
  }

  function ir(n, sentido){
    n = Math.max(0, Math.min(hojas.length-1, n));
    pararVoz();
    document.querySelectorAll("video").forEach(v=>v.pause());
    const vieja = libro.querySelector(".hoja");
    const ladosViejos = vieja && !vieja.classList.contains("sola") ? [...vieja.children].filter(c=>c.classList.contains("lado")) : [];
    actual = n;
    libro.innerHTML = pintar(hojas[n], n);
    const hoja = libro.firstElementChild;
    const ladosNuevos = hoja.classList.contains("sola") ? [] : [...hoja.children].filter(c=>c.classList.contains("lado"));
    if(sentido){
      if(ladosViejos.length===2 && ladosNuevos.length===2 && dosPaginas.matches && !sinMovimiento.matches)
        voltearHoja(sentido, ladosViejos, ladosNuevos);
      else if(!sinMovimiento.matches) hoja.classList.add("suave");
    }
    $("#ant").disabled = $("#ant2").disabled = n===0;
    $("#sig").disabled = $("#sig2").disabled = n===hojas.length-1;
    $("#avance").max = hojas.length-1; $("#avance").value = n;
    $("#contador").textContent = `${n+1} / ${hojas.length}`;
    // precargar las láminas vecinas
    [n+1,n-1].forEach(k=>{ if(hojas[k] && hojas[k].img){ const im=new Image(); im.src=hojas[k].img; }});
    const h = hojas[n];
    const ancla = h.id || (h.tipo==="indice" ? "indice" : h.tipo==="carta" ? "carta" : "pagina-"+(n+1));
    if(location.hash !== "#"+ancla) history.replaceState(null, "", "#"+ancla);
    ajustarLetra(hoja);
    if(leerSolo && audioDe(h)) tocar(hoja.querySelector(".escuchar"));
  }

  const dosPaginas = matchMedia("(min-width:821px) and (orientation:landscape)");
  const sinMovimiento = matchMedia("(prefers-reduced-motion: reduce)");
  // La hoja derecha (o izquierda, al regresar) gira sobre el lomo
  function voltearHoja(sentido, viejos, nuevos){
    const copia = el => { const c = el.cloneNode(true); c.removeAttribute("tabindex"); return c; };
    const queda = document.createElement("div");
    const hojaQueGira = document.createElement("div");
    const frente = document.createElement("div"), atras = document.createElement("div");
    frente.className = "cara frente"; atras.className = "cara atras";
    if(sentido>0){
      queda.className = "queda izq";  queda.appendChild(copia(viejos[0]));   // lo que se ve a la izquierda mientras gira
      hojaQueGira.className = "voltea der";
      frente.appendChild(copia(viejos[1])); atras.appendChild(copia(nuevos[0]));
    }else{
      queda.className = "queda der";  queda.appendChild(copia(viejos[1]));
      hojaQueGira.className = "voltea izq";
      frente.appendChild(copia(viejos[0])); atras.appendChild(copia(nuevos[1]));
    }
    hojaQueGira.append(frente, atras);
    queda.setAttribute("aria-hidden","true"); hojaQueGira.setAttribute("aria-hidden","true");
    libro.append(queda, hojaQueGira);
    const limpiar = ()=>{ queda.remove(); hojaQueGira.remove(); };
    hojaQueGira.addEventListener("animationend", e=>{ if(e.target===hojaQueGira) limpiar(); });
    setTimeout(limpiar, 1200);
  }

  // En pantalla grande, achica la letra de la carta hasta que quepa sin scroll
  function ajustarLetra(hoja){
    const lado = hoja.querySelector(".lado.carta");
    if(!lado || !dosPaginas.matches) { if(lado) lado.style.fontSize=""; return; }
    let t = 1.15;                       // tamaño inicial (rem)
    lado.style.fontSize = t + "rem";
    while(lado.scrollHeight > lado.clientHeight + 1 && t > 0.72){
      t -= 0.03; lado.style.fontSize = t.toFixed(2) + "rem";
    }
  }
  window.addEventListener("resize", ()=>{ const h=libro.querySelector(".hoja"); if(h) ajustarLetra(h); });

  function tocar(btn){
    if(!btn) return;
    const src = btn.dataset.audio;
    if(btn.getAttribute("aria-pressed")==="true"){ pararVoz(); return; }
    pararVoz();
    voz.src = src;
    voz.play().then(()=>{
      btn.setAttribute("aria-pressed","true");
      btn.querySelector(".rotulo").textContent = tx("Pausar","Pause");
    }).catch(()=>{});
  }
  voz.addEventListener("ended", pararVoz);

  function desdeAncla(){
    const a = decodeURIComponent(location.hash.slice(1));
    if(!a) return 0;
    if(a==="indice") return hojas.findIndex(h=>h.tipo==="indice");
    if(a==="carta") return hojas.findIndex(h=>h.tipo==="carta");
    const porId = hojas.findIndex(h=>h.id===a);
    if(porId>=0) return porId;
    const m = a.match(/^pagina-(\d+)$/);
    return m ? (+m[1]-1) : 0;
  }

  // Eventos
  $("#ant").onclick = $("#ant2").onclick = ()=>ir(actual-1,-1);
  $("#sig").onclick = $("#sig2").onclick = ()=>ir(actual+1, 1);
  window.addEventListener("hashchange", ()=>{ const n=desdeAncla(); if(n!==actual) ir(n, n>actual?1:-1); });

  libro.addEventListener("click", e=>{
    const b = e.target.closest(".escuchar"); if(b){ tocar(b); return; }
    const a = e.target.closest("[data-ir]"); if(a){ ir(+a.dataset.ir, 1); return; }
    const l = e.target.closest("[data-grande]"); if(l) abrirVisor(l.dataset.grande, l.querySelector("img").alt);
  });
  libro.addEventListener("keydown", e=>{
    const l = e.target.closest("[data-grande]");
    if(l && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); abrirVisor(l.dataset.grande, l.querySelector("img").alt); }
  });

  document.addEventListener("keydown", e=>{
    if($("#visor").classList.contains("abierto")){ if(e.key==="Escape") cerrarVisor(); return; }
    if(e.target.closest("video")) return;
    if(e.key==="ArrowRight"||e.key==="PageDown") ir(actual+1,1);
    if(e.key==="ArrowLeft"||e.key==="PageUp") ir(actual-1,-1);
    if(e.key==="Home") ir(0,-1);
    if(e.key==="End") ir(hojas.length-1,1);
  });

  // deslizar el dedo
  let x0=null, y0=null;
  libro.addEventListener("touchstart", e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
  libro.addEventListener("touchend", e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) ir(actual+(dx<0?1:-1), dx<0?1:-1);
    x0=null;
  });

  $("#btn-auto").onclick = function(){
    leerSolo = !leerSolo; this.setAttribute("aria-pressed", leerSolo);
    try{ localStorage.setItem("cucu-leer", leerSolo?"1":"0"); }catch(e){}
    if(leerSolo) tocar(libro.querySelector(".escuchar")); else pararVoz();
  };
  $("#btn-letra").onclick = function(){
    const g = document.body.classList.toggle("letra-grande"); this.setAttribute("aria-pressed", g);
    try{ localStorage.setItem("cucu-letra", g?"1":"0"); }catch(e){}
  };

  // visor de láminas
  let volverA = null;
  function abrirVisor(src, alt){
    volverA = document.activeElement;
    $("#visor-img").src = src; $("#visor-img").alt = alt||"";
    $("#visor").classList.add("abierto"); $("#visor-cerrar").focus();
  }
  function cerrarVisor(){ $("#visor").classList.remove("abierto"); if(volverA) volverA.focus(); }
  $("#visor").onclick = cerrarVisor;

  // Idioma: el libro siempre abre en español
  function rotular(){
    document.documentElement.lang = idioma;
    document.title = campo(LIBRO,"titulo");
    $("#nombre-libro").textContent = campo(LIBRO,"titulo");
    const bI = $("#btn-idioma");
    bI.textContent = EN() ? "Español" : "English";
    bI.lang = EN() ? "es" : "en";
    bI.setAttribute("aria-label", EN() ? "Leer el cuento en español" : "Read the story in English");
    const t = (sel, txt, aria) => { const el=$(sel); el.querySelector(".txt").textContent=txt; el.setAttribute("aria-label",aria); };
    t("#lnk-bib", tx("Biblioteca","Library"), tx("Volver a la biblioteca de cuentos","Back to the story library"));
    t("#lnk-ind", tx("Índice","Contents"), tx("Ir al índice","Go to the contents"));
    t("#btn-auto", tx("Léemelo","Read to me"), tx("Léemelo: cada página se lee en voz alta al pasarla","Read to me: each page is read aloud when you turn it"));
    t("#btn-letra", tx("Letra","Text"), tx("Letra más grande","Larger text"));
    $("#ant").setAttribute("aria-label",tx("Página anterior","Previous page")); $("#ant2").setAttribute("aria-label",tx("Página anterior","Previous page"));
    $("#sig").setAttribute("aria-label",tx("Página siguiente","Next page")); $("#sig2").setAttribute("aria-label",tx("Página siguiente","Next page"));
    $("#avance").setAttribute("aria-label",tx("Avance en el libro","Progress through the book"));
    $("#visor-cerrar").setAttribute("aria-label",tx("Cerrar la lámina","Close the picture"));
  }
  $("#btn-idioma").onclick = () => { idioma = EN() ? "es" : "en"; rotular(); ir(actual); };
  if(!LIBRO.narracion.es && !LIBRO.narracion.en) $("#btn-auto").style.display = "none";
  rotular();
  ir(desdeAncla());
})();
</script>
